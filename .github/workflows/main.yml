# GitHub Actions workflow for creating a new FoundryVTT module release.
#
# How to release:
#   1. Bump nothing by hand — the version comes from the release tag.
#   2. Create and publish a GitHub Release with a tag like "v2.0.0" (or "2.0.0").
#   3. This workflow patches module.json (version / url / manifest / download),
#      builds module.zip and attaches both files to the release.
#
# The manifest committed in the repository keeps REAL values so a checked-out
# copy works as-is in a local Foundry Data/modules folder; the release copy is
# patched in the runner's filesystem only (никаких коммитов не создаётся).
#
# Foundry install URL (stable, always latest release):
#   https://github.com/Frost-Jack/cyberpunk-red-agent-os-modified/releases/latest/download/module.json
name: Create Module Files For GitHub Release

env:
  project_url: "https://github.com/${{ github.repository }}"
  latest_manifest_url: "https://github.com/${{ github.repository }}/releases/latest/download/module.json"
  release_module_url: "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip"

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fail the release early if the module doesn't pass its own checks.
      - name: Run static verification suite
        run: node tools/verify.mjs

      # Tag "v2.0.0" or "2.0.0" -> "2.0.0"
      - name: Extract Version From Tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Patch the manifest IN THE RUNNER ONLY (the repo file keeps working
      # values for local checkouts). jq edits real JSON — no token
      # placeholders that would break a locally-installed copy.
      - name: Patch Module Manifest With Release Values
        run: |
          jq \
            --arg version  "${{ steps.get_version.outputs.version }}" \
            --arg url      "${{ env.project_url }}" \
            --arg manifest "${{ env.latest_manifest_url }}" \
            --arg download "${{ env.release_module_url }}" \
            '.version = $version | .url = $url | .manifest = $manifest | .download = $download' \
            module.json > module.json.tmp
          mv module.json.tmp module.json
          echo "--- patched manifest ---"
          jq '{id, version, url, manifest, download}' module.json

      # Everything Foundry needs at runtime. The GIMP source of the Trauma
      # Team card (~3 MB .xcf) is excluded from the player-facing archive.
      - name: Create Module Archive
        run: |
          zip --recurse-paths ./module.zip \
            module.json \
            README.md \
            LICENSE \
            CHANGELOG.md \
            templates/ \
            scripts/ \
            styles/ \
            lang/ \
            assets/ \
            --exclude "assets/TTCardFiles/*.xcf"
          unzip -l module.zip

      - name: Update Release With Files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./module.zip'
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
